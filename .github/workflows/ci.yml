name: cross-platform smoke test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --check server.js
        run: node --check server.js

      - name: Start server and smoke-test /api/usage
        shell: bash
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:3789/api/usage -o response.json
          cat response.json
          kill $SERVER_PID
