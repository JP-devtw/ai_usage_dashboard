<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="pageTitle">AI 使用量儀表板</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Crect x='5' y='17' width='5' height='10' rx='1.5' fill='%2322c55e'/%3E%3Crect x='13.5' y='11' width='5' height='16' rx='1.5' fill='%23fbbf24'/%3E%3Crect x='22' y='6' width='5' height='21' rx='1.5' fill='%2338bdf8'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0c;
    --surface: #17181b;
    --surface-2: #1e1f23;
    --surface-rgb: 23, 24, 27;
    --border: #2c2d32;
    --border-rgb: 44, 45, 50;
    --text: #e8e8ea;
    --text-muted: #9a9ba3;
    --text-faint: #5c5d64;
    --accent: #38bdf8;
    --accent-rgb: 56, 189, 248;
    --accent-2: #f59e0b;
    --ok: #22c55e;
    --ok-rgb: 34, 197, 94;
    --warn: #eab308;
    --warn-rgb: 234, 179, 8;
    --danger: #ef4444;
    --danger-rgb: 239, 68, 68;
    --heat-1: #163a5c;
    --heat-2: #1c5c92;
    --heat-3: #268fd6;
    --heat-4: #5fd0ff;
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --surface-rgb: 255, 255, 255;
    --border: #dde3ee;
    --border-rgb: 210, 218, 232;
    --text: #1b2432;
    --text-muted: #64748b;
    --text-faint: #94a3b8;
    --accent: #0284c7;
    --accent-rgb: 2, 132, 199;
    --accent-2: #b45309;
    --ok: #16a34a;
    --ok-rgb: 22, 163, 74;
    --warn: #ca8a04;
    --warn-rgb: 202, 138, 4;
    --danger: #dc2626;
    --danger-rgb: 220, 38, 38;
    --heat-1: #dbeafe;
    --heat-2: #93c5fd;
    --heat-3: #3b82f6;
    --heat-4: #1d4ed8;
    --shadow-card: 0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px clamp(10px, 3vw, 40px);
  }

  /* ---------- 數字與時間排版防抖動 (Tabular Nums) ---------- */
  .bar-text, .token-val, .token-time, .sub, .ctx-pct, .mini-name, #statusText, .reset-mark {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 18px;
  }
  h1 { font-size: 19px; letter-spacing: 2px; font-weight: 700; }
  h1 .pix { color: var(--accent); }
  #status {
    font-size: 12px; color: var(--text-muted);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .dot.ok  { background: var(--ok); }
  .dot.err { background: var(--danger); }
  .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px;
    transition: border-color .2s, background-color .2s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger  { background: rgba(var(--danger-rgb), .12); border-color: var(--danger); color: var(--danger); }
  #langToggle, #themeToggle, #viewToggle, #notifyToggle { font-size: 12px; padding: 6px 12px; }

  /* ---------- 區塊標題(目前狀態 / 趨勢) ---------- */
  .section-heading {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700;
    color: var(--text-muted); margin: 22px 0 8px;
  }
  #trendsSection .section-heading { margin-top: 0; }
  .widget-mode .section-heading { display: none; }

  /* ---------- 提供商橫列 ---------- */
  #rows { display: flex; flex-direction: column; gap: 12px; }
  .row {
    position: relative;
    display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow-card);
    transition: border-color .3s, box-shadow .3s, transform .2s;
  }
  
  /* 高危臨界外框光圈 (Critical Ambient Glow) */
  .row.critical-glow {
    border-color: rgba(var(--danger-rgb), .7);
    animation: criticalPulse 2s ease-in-out infinite;
  }
  @keyframes criticalPulse {
    0%, 100% { box-shadow: 0 0 10px rgba(var(--danger-rgb), .25), var(--shadow-card); }
    50%      { box-shadow: 0 0 20px rgba(var(--danger-rgb), .6), var(--shadow-card); }
  }

  /* Hover 快捷動作按鈕 (Quick Action Bar) */
  .row-actions {
    position: absolute; top: 12px; right: 14px;
    display: flex; gap: 6px; z-index: 5;
    opacity: 0; transition: opacity .2s ease;
  }
  .row:hover .row-actions { opacity: 1; }
  .row-action-btn {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px; font-size: 11px;
    color: var(--text-muted); cursor: pointer;
  }
  .row-action-btn:hover { color: var(--text); border-color: var(--accent); }

  .prov { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .prov-name {
    font-size: 17px; font-weight: 700; letter-spacing: .3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    display: flex; align-items: center; gap: 8px;
  }
  .drag-handle {
    cursor: grab; color: var(--text-muted); font-size: 15px;
    user-select: none; flex: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .collapse-btn {
    background: none; border: none; padding: 0; margin: 0; font: inherit;
    color: var(--text-muted); cursor: pointer; flex: none; width: 12px;
  }
  .collapse-btn:hover { color: var(--text); }
  .row.collapsed { padding-top: 10px; padding-bottom: 10px; }
  .row.dragging { opacity: .45; }
  .row.drag-over-top    { box-shadow: 0 -3px 0 var(--accent), var(--shadow-card); }
  .row.drag-over-bottom { box-shadow: 0  3px 0 var(--accent), var(--shadow-card); }

  /* 觸控/窄螢幕:拖拉不可用,改用上下移動鍵 */
  .move-btns { display: none; gap: 6px; }
  .move-btns button { padding: 3px 12px; font-size: 13px; line-height: 1; }
  .move-btns button:disabled { opacity: .25; cursor: default; }
  @media (max-width: 720px), (pointer: coarse) {
    .move-btns { display: flex; }
    .drag-handle { display: none; }
  }
  .prov-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .prov-err { font-size: 11px; color: var(--danger); line-height: 1.3; }
  .edit-btn { align-self: flex-start; font-size: 12px; padding: 3px 10px; }

  /* .metrics 依時間窗分左右兩欄:sess/lt 使用量條已合併距重置倒數(見 hpCell),不再各佔一條血條 */
  .metrics {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 12px;
    grid-template-areas:
      "sess lt"
      "ctx tokens";
  }

  /* 精簡視圖模式 (Compact Mode) */
  body.compact-mode .metrics {
    grid-template-areas: "sess lt";
  }
  body.compact-mode .metrics > .metric:is(:nth-child(2), :nth-child(3)) {
    display: none;
  }
  body.compact-mode #trendsSection {
    display: none;
  }

  .metrics > .metric:nth-child(1) { grid-area: sess; }
  .metrics > .metric:nth-child(2) { grid-area: ctx; }
  .metrics > .metric:nth-child(3) { grid-area: tokens; }
  .metrics > .metric:nth-child(4) { grid-area: lt; }
  .metric { min-width: 0; }
  .metrics > .metric:is(:nth-child(1), :nth-child(4)) .bar { height: 32px; border-radius: 9px; }
  .metrics > .metric:is(:nth-child(1), :nth-child(4)) .bar-text { font-size: 14px; }
  .metrics > .metric:is(:nth-child(1), :nth-child(4)) .metric-label { font-size: 12px; color: var(--text); }
  .metrics > .metric:is(:nth-child(1), :nth-child(4)) .sub { font-size: 12px; color: var(--text-muted); }
  .metrics > .metric:is(:nth-child(2), :nth-child(3)) { opacity: .92; }
  .metrics > .metric:is(:nth-child(2), :nth-child(3)) .bar { height: 20px; }
  .metrics > .metric:is(:nth-child(2), :nth-child(3)) .bar-text { font-size: 11px; }
  .metric-label {
    font-size: 11px; color: var(--text-muted); letter-spacing: .4px;
    margin-bottom: 6px; display: flex; justify-content: space-between; gap: 4px;
    white-space: nowrap; overflow: hidden; text-transform: uppercase; font-weight: 600;
  }
  .src { color: var(--text-faint); font-size: 10px; text-transform: none; font-weight: 500; }
  .sub { font-size: 11px; color: var(--text-muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reset-mark.reset-soon { color: var(--warn); font-weight: 700; }

  /* ---------- Token 顯示 ---------- */
  .token-display {
    position: relative; height: 20px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    overflow: hidden; display: flex; align-items: center; justify-content: space-around;
    padding: 0 4px; font-family: monospace;
  }
  .token-item {
    display: flex; align-items: center; gap: 3px; font-size: 11px;
  }
  .token-time {
    color: var(--text-faint);
  }
  .token-val {
    color: var(--accent);
    font-weight: 700;
  }

  /* ---------- 用量條與動態光澤 (Shimmer) ---------- */
  .bar {
    position: relative; height: 24px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    overflow: hidden;
  }
  .fill {
    position: absolute; top: 0; bottom: 0; left: 0;
    border-radius: 6px 0 0 6px;
    transition: width .6s ease;
  }
  /* 流暢微光掃過 (Shimmer Effect) */
  .fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.16), transparent);
    animation: barShimmer 3s infinite linear;
  }
  @keyframes barShimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .ticks { display: none; }
  .bar-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; letter-spacing: .3px;
    color: var(--text);
    pointer-events: none;
    z-index: 2;
  }
  /* 無法讀取:虛線框,避免誤導 */
  .bar.na { border-style: dashed; border-color: var(--border); background: var(--surface-2); }
  .na-text { color: var(--text-faint) !important; font-weight: 600; }
  .ctx-line { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-muted); }
  .ctx-name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
  .ctx-pct { flex: none; }
  details.ctx-more { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
  details.ctx-more summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .fill.g { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .fill.y { background: linear-gradient(90deg, #d97706, #f59e0b); }
  .fill.r { background: linear-gradient(90deg, #dc2626, #ef4444); animation: lowhp 1.6s ease-in-out infinite; }
  @keyframes lowhp { 50% { opacity: .78; } }

  /* 重生滿血爆光閃爍動畫 (Refill Flash FX) */
  .bar.refill-flash {
    animation: refillFlash 1.2s ease-out forwards;
  }
  @keyframes refillFlash {
    0%   { filter: brightness(2.2); box-shadow: 0 0 20px var(--accent); }
    100% { filter: brightness(1.0); box-shadow: none; }
  }

  /* ---------- 重置倒數條 ---------- */
  .bar.cd.ready { border-color: var(--accent); }
  .bar.cd.ready .fill { animation: readyPulse 1.6s ease-in-out infinite; }
  @keyframes readyPulse { 50% { opacity: .8; } }

  /* 倒數 < 30 分鐘:外框顏色開始脈動,越接近重置脈動越快 */
  .bar.cd.soon {
    animation: chargeGlow var(--charge-speed, 1.4s) ease-in-out infinite;
  }
  @keyframes chargeGlow {
    0%, 100% { border-color: rgba(var(--accent-rgb),.35); }
    50%      { border-color: var(--accent); }
  }

  .empty-note { color: var(--text-muted); text-align: center; padding: 40px 0; font-size: 14px; }

  /* Mini 模式 Hover 彈出卡片 (Hover Peek Card) */
  #miniPeekCard {
    position: fixed; z-index: 999;
    background: var(--surface); border: 1px solid var(--accent);
    border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    font-size: 12px; pointer-events: none;
    opacity: 0; transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
    max-width: 260px;
  }
  #miniPeekCard.show { opacity: 1; transform: translateY(0); }

  /* ---------- 草皮圖(近 12 個月使用量熱力圖) ---------- */
  .heatmap-card {
    background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
    box-shadow: var(--shadow-card);
    overflow-x: auto;
  }
  .heatmap-inner { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .heatmap-months {
    display: grid; gap: 3px;
    margin-left: 28px; font-size: 10px; color: var(--text-muted); height: 14px;
  }
  .heatmap-months span { white-space: nowrap; } /* 標籤(如「12月」)比欄寬還寬時,禁止換行改往右溢出,避免撐高整列 */
  .heatmap-body { display: flex; gap: 6px; }
  .heatmap-wdays {
    display: grid; grid-template-rows: repeat(7, 12px); gap: 3px;
    font-size: 10px; color: var(--text-muted); width: 22px; flex: none;
  }
  .heatmap-wdays span { display: flex; align-items: center; }
  .heatmap-grid {
    display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; gap: 3px;
    flex: 1; min-width: 0;
  }
  .heatmap-cell { height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border); }
  .heatmap-cell.empty { visibility: hidden; }
  .heatmap-cell.lv1 { background: var(--heat-1); border-color: transparent; }
  .heatmap-cell.lv2 { background: var(--heat-2); border-color: transparent; }
  .heatmap-cell.lv3 { background: var(--heat-3); border-color: transparent; }
  .heatmap-cell.lv4 { background: var(--heat-4); border-color: transparent; }
  .heatmap-footer {
    display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
    font-size: 11px; color: var(--text-muted); flex-wrap: wrap; gap: 8px;
  }
  .heatmap-legend { display: flex; align-items: center; gap: 4px; }
  .heatmap-legend .heatmap-cell { width: 10px; height: 10px; }
  .widget-mode .heatmap-card { display: none; }
  .heatmap-caption-btn {
    background: none; border: none; padding: 0; margin: 0; font: inherit; font-size: 11px;
    color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .heatmap-caption-btn:hover { color: var(--text); }
  .heatmap-chev { font-size: 9px; }
  .heatmap-project-list {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px; max-height: 280px; overflow-y: auto;
  }
  .heatmap-project-row {
    display: grid; grid-template-columns: 20px minmax(0, 1fr) 84px 60px;
    align-items: center; gap: 10px; font-size: 12px; padding: 5px 4px; border-radius: 6px;
  }
  .heatmap-project-row:hover { background: var(--surface-2); }
  .heatmap-project-rank { color: var(--text-muted); font-size: 10px; text-align: right; }
  .heatmap-project-name {
    color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .heatmap-project-bar-track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .heatmap-project-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .heatmap-project-tokens { color: var(--accent); font-family: monospace; text-align: right; }
  .heatmap-project-empty { color: var(--text-muted); text-align: center; padding: 10px 0; font-size: 12px; }

  /* ---------- Token 流量圖(近 24 小時,每小時一格) ---------- */
  .tokenflow-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .tokenflow-title-group { display: flex; align-items: baseline; gap: 6px; }
  .tokenflow-title { font-size: 12px; color: var(--text-muted); letter-spacing: .5px; }
  .tokenflow-unit { font-size: 10px; color: var(--text-muted); opacity: .7; }
  .tf-tabs {
    display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 2px;
  }
  .tf-tab {
    background: none; border: none; padding: 3px 10px; font: inherit; font-size: 11px;
    color: var(--text-muted); cursor: pointer; border-radius: 5px;
  }
  .tf-tab:hover { border-color: transparent; color: var(--text); }
  .tf-tab.active { background: var(--surface); color: var(--text); font-weight: 600; }
  .tokenflow-toggles { display: flex; gap: 14px; font-size: 12px; color: var(--text-muted); }
  .tokenflow-toggles label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .tokenflow-toggles input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; margin: 0; }
  .tf-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .tf-dot.claude { background: var(--accent); }
  .tf-dot.codex { background: var(--accent-2); }
  .tokenflow-body { display: flex; gap: 6px; }
  .tokenflow-yaxis {
    display: flex; flex-direction: column; justify-content: space-between;
    width: 44px; flex: none; height: 90px;
    font-size: 10px; color: var(--text-muted); text-align: right;
  }
  .tokenflow-plot { position: relative; flex: 1; min-width: 0; }
  .tokenflow-gridlines {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
    pointer-events: none;
  }
  .tokenflow-gridlines div { border-top: 1px dashed var(--border); height: 0; }
  .tokenflow-chart {
    position: relative; display: flex; align-items: flex-end; gap: 3px; height: 90px;
  }
  .tf-group {
    flex: 1; display: flex; align-items: flex-end; justify-content: center;
    gap: 2px; height: 100%; min-width: 0;
  }
  .tf-bar { flex: 1; max-width: 11px; border-radius: 2px 2px 0 0; }
  .tf-bar.claude { background: var(--accent); }
  .tf-bar.codex { background: var(--accent-2); }
  .tokenflow-axis-row { display: flex; gap: 6px; margin-top: 5px; }
  .tokenflow-yaxis-spacer { width: 44px; flex: none; }
  .tokenflow-axis { display: flex; gap: 3px; font-size: 10px; color: var(--text-muted); flex: 1; min-width: 0; }
  .tf-axis-label { flex: 1; text-align: center; min-width: 0; white-space: nowrap; overflow: hidden; }
  .widget-mode .tokenflow-card { display: none; }

  /* ---------- RWD ---------- */
  @media (max-width: 720px) {
    .row { grid-template-columns: 1fr; }
    .prov { flex-direction: row; align-items: center; flex-wrap: wrap; }
    .edit-btn { margin-left: auto; }
    .metrics {
      grid-template-columns: 1fr;
      grid-template-areas:
        "sess"
        "lt"
        "ctx"
        "tokens";
    }
  }

  /* ---------- 編輯視窗 ---------- */
  dialog {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 22px; width: min(480px, 92vw);
  }
  dialog::backdrop { background: rgba(3,7,18,.6); }
  dialog h2 { font-size: 16px; margin-bottom: 4px; letter-spacing: 1px; }
  dialog .hint { font-size: 11px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.5; }
  fieldset {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px 12px; margin-bottom: 12px;
  }
  legend { font-size: 12px; color: var(--accent); padding: 0 6px; letter-spacing: .5px; }
  .frow { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .frow label { font-size: 12px; color: var(--text-muted); min-width: 86px; }
  input, select {
    font: inherit; font-size: 13px; color: var(--text);

  /* ---------- Toast 通知 ---------- */
  #toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 50;
    max-width: min(420px, 90vw);
    background: var(--surface); border: 1px solid var(--accent); border-radius: 10px;
    padding: 12px 16px; font-size: 13px; line-height: 1.5;
    box-shadow: var(--shadow-card);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .3s, transform .3s;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-color: var(--danger); }

  /* ---------- 浮動小工具模式(?widget=1,見 floating-widget.ps1) ---------- */
  /* 只留供應商卡片本身,拿掉標題/狀態/語系/主題/新增按鈕;背景與卡片底色都改半透明,讓桌面透出來 */
  .widget-mode body { background: transparent; padding: 8px; }
  .widget-mode header { display: none; }
  .widget-mode .row { background: rgba(var(--surface-rgb),.55); border-color: rgba(var(--border-rgb),.5); box-shadow: none; }
  /* 用量條本身也改半透明(軌道 + 三種用量色 + 倒數條的填色) */
  .widget-mode .bar { background: rgba(var(--surface-rgb),.3); }
  .widget-mode .fill.g { background: rgba(var(--ok-rgb),.55); }
  .widget-mode .fill.y { background: rgba(var(--warn-rgb),.55); }
  .widget-mode .fill.r { background: rgba(var(--danger-rgb),.55); }
  .widget-mode .bar.cd .fill { background: rgba(var(--accent-rgb),.55); }
  /* 捲軸也改透明:隱藏上下箭頭圖示,軌道透明,滑塊改半透明白 */
  .widget-mode ::-webkit-scrollbar { width: 8px; }
  .widget-mode ::-webkit-scrollbar-track { background: transparent; }
  .widget-mode ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
  .widget-mode ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  /* 拖動視窗:WebView2 會吞掉頁面範圍內所有滑鼠事件,宿主(floating-widget.ps1)的隱形邊框
     只有幾 px 很難抓。改成整個內容區都能按住拖動(互動元件除外,見 <body> 開頭的 mousedown
     處理),hover 時顯示抓取游標 + 頂端 ⠿ 拖動提示條,讓使用者知道可以拖。 */
  .widget-mode body { cursor: grab; }
  .widget-mode :is(button, summary) { cursor: pointer; }
  .widget-mode :is(input, select, textarea), .widget-mode dialog { cursor: auto; }
  #dragHint { display: none; }
  .widget-mode #dragHint {
    display: block; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    padding: 3px 16px 4px; border-radius: 0 0 10px 10px;
    background: rgba(255,255,255,.16); color: rgba(255,255,255,.8);
    font-size: 11px; line-height: 1; letter-spacing: 4px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40;
    user-select: none;
  }
  html.widget-mode:hover #dragHint { opacity: 1; }
  html.mini-mode #dragHint { display: none; } /* 迷你模式只有 20px 高,沒空間;整行都可拖,游標提示就夠 */

  /* ---------- 迷你橫式模式(?widget=1&mini=1&provider=xxx,見 floating-widget.ps1 -Mini) ---------- */
  /* 一次只顯示一個供應商:名稱 + 用量條 + 百分比 + 重置倒數,擠進約 20px 高一行;方向鍵上/下切換供應商 */
  #miniLine { display: none; }
  .mini-mode body { padding: 0; }
  .mini-mode #rows { display: none; }
  .mini-mode #miniLine {
    display: flex; align-items: center; gap: 6px;
    height: 20px; padding: 0 6px; box-sizing: border-box;
    background: rgba(var(--surface-rgb),.6);
    border-radius: 6px; font-size: 11px; white-space: nowrap; overflow: hidden;
  }
  .mini-mode .mini-name {
    font-weight: 700; flex: none; max-width: 30%;
    overflow: hidden; text-overflow: ellipsis;
  }
  .mini-mode #miniLine .bar { height: 14px; border-radius: 4px; flex: 1 1 auto; min-width: 40px; }
  .mini-mode #miniLine .bar-text { font-size: 10px; letter-spacing: 0; }
  .mini-mode #miniLine .cd { flex: 0 0 auto; width: 30%; min-width: 60px; }

<script>
// 浮動小工具模式(見 floating-widget.ps1):網址帶 ?widget=1 時加上 widget-mode class,
// 背景改透明(讓 WebView2 host 設的 DefaultBackgroundColor 透出桌面)、隱藏標題列/狀態/語系/
// 新增提供商按鈕、卡片底色改半透明;一般瀏覽器開啟不受影響。
if (new URLSearchParams(location.search).get('widget') === '1') {
  document.documentElement.classList.add('widget-mode');
  if (new URLSearchParams(location.search).get('mini') === '1') {
    document.documentElement.classList.add('mini-mode');
  }
  // WebView2/WKWebView 是獨立的原生子視窗,會吞掉自己範圍內所有滑鼠事件,原生宿主只剩幾 px
  // 的隱形邊框能拖,很難抓。改成由頁面發起:在非互動區按下左鍵時 postMessage('drag') 通知宿主
  // (Windows: floating-widget.ps1/AiDashWidget 收到後轉送 WM_NCLBUTTONDOWN+HTCAPTION 由原生
  // 接手拖移;macOS: AiDashWidgetMac 收到後呼叫 NSWindow.performDrag)。按鈕/輸入框/排序把手/
  // 摺疊摘要/對話框、以及捲軸上的按壓不觸發,維持原本互動不受影響。一般瀏覽器開 ?widget=1
  // 時沒有 chrome.webview 也沒有對應的 webkit.messageHandlers,整段自動跳過。
  const dragHandler = window.chrome && window.chrome.webview
    ? (msg) => window.chrome.webview.postMessage(msg)
    : (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.dragHandler)
      ? (msg) => window.webkit.messageHandlers.dragHandler.postMessage(msg)
      : null;
  if (dragHandler) {
    window.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || !(e.target instanceof Element)) return;
      if (e.target.closest('button, input, select, textarea, summary, dialog, .drag-handle')) return;
      const de = document.documentElement;
      if (e.clientX >= de.clientWidth || e.clientY >= de.clientHeight) return; // 按在捲軸上
      dragHandler('drag');
      e.preventDefault();
    });
  }
}
</script>

// ---------------- 狀態 ----------------
// [id, 名稱, 是否支援自動同步]
const BUILTINS = [
  ['claude', 'Claude', true],
  ['codex', 'Codex', true],
  ['antigravity', 'Antigravity', true],
];
let autoData = {};          // /api/usage 回傳的自動資料(不落地)
let online = false;
let lastSync = null;
let state = load();

function mkProvider(id, name, autoKey) {
  const now = Date.now();
  const p = {
    id, name, autoKey: autoKey || null,
    collapsed: id !== 'claude', // 預設只展開 Claude,其餘收合(2026-07-22 使用者要求)
    manual: {
      session:  { usedPct: 35, resetsAt: now + 2 * 3600e3, windowMin: 300 },
      context:  { usedPct: 20 },
      longterm: { usedPct: 45, resetsAt: now + 3 * 86400e3, windowMin: 10080, label: '每週' }, // label 為內部標準值(中文),顯示時經 t() 翻譯
    },
  };
  return p;
}
function mkBuiltin([id, name, hasAuto]) { return mkProvider(id, name, hasAuto ? id : null); }
function defaultState() {
  return { providers: BUILTINS.map(mkBuiltin) };
}
// 內建提供商只播種一次:升級後自動出現,使用者刪除後不會復活
function seedBuiltins(s) {
  s.seeded = Array.isArray(s.seeded) ? s.seeded
    : s.providers.filter(p => BUILTINS.some(b => b[0] === p.id)).map(p => p.id);
  let added = false;
  for (const b of BUILTINS) {
    if (!s.seeded.includes(b[0])) {
      s.providers.push(mkBuiltin(b));
      s.seeded.push(b[0]);
      added = true;
    }
    // 遷移:內建提供商升級為自動同步時,補上既有列的 autoKey
    const existing = s.providers.find(p => p.id === b[0]);
    if (existing && b[2] && !existing.autoKey) {
      existing.autoKey = b[0];
      added = true;
    }
  }
  // 遷移:既有(本功能推出前建立的)provider 補上 collapsed 欄位預設值,只補一次,不覆蓋使用者之後的手動展開/收合
  for (const p of s.providers) {
    if (p.collapsed === undefined) {
      p.collapsed = p.id !== 'claude';
      added = true;
    }
  }
  if (added) localStorage.setItem(LS_KEY, JSON.stringify(s));
  return s;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && Array.isArray(s.providers) && s.providers.length) return seedBuiltins(s);
  } catch {}
  return seedBuiltins(defaultState());
}
function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

// ---------------- 資料合成:自動優先,手動保底 ----------------
function effective(p) {
  const a = p.autoKey ? autoData[p.autoKey] : null;
  const auto = (a && a.ok) ? a : null;
  // src 為內部標準值('manual'/'auto'),顯示時經 t('srcManual'/'srcAuto') 翻譯
  const sess = { ...p.manual.session, src: 'manual' };
  const lt   = { ...p.manual.longterm, src: 'manual' };

  if (auto && auto.session === null) {
    // 上游明確回報「此提供商沒有 session 級資料」(如 Antigravity 只有週配額,無 5 小時層級)。
    // 2026-07-04 使用者確認:這種情況不要用手動預設值冒充,改顯示無法讀取(跟 Context 一致),
    // 即使代價是手動值從此被永久蓋過、無法在這個欄位自行手動追蹤。
    sess.usedPct = null; sess.resetsAt = null; sess.src = 'auto';
  } else if (auto && auto.session) {
    if (auto.session.usedPct != null) { sess.usedPct = auto.session.usedPct; sess.src = 'auto'; }
    if (auto.session.resetsAt) { const t = Date.parse(auto.session.resetsAt); if (!isNaN(t)) sess.resetsAt = t; }
    if (auto.session.windowMinutes) sess.windowMin = auto.session.windowMinutes;
  }
  if (auto && auto.longterm === null) {
    lt.usedPct = null; lt.resetsAt = null; lt.src = 'auto';
  } else if (auto && auto.longterm) {
    if (auto.longterm.usedPct != null) { lt.usedPct = auto.longterm.usedPct; lt.src = 'auto'; }
    if (auto.longterm.resetsAt) { const t = Date.parse(auto.longterm.resetsAt); if (!isNaN(t)) lt.resetsAt = t; }
    if (auto.longterm.windowMinutes) lt.windowMin = auto.longterm.windowMinutes;
    if (auto.longtermLabel) lt.label = auto.longtermLabel;
  }
  // Context:只信本機 session 掃描結果;抓不到就標示無法讀取(灰色),不用假數字
  let ctx = null;
  const rawAuto = p.autoKey ? autoData[p.autoKey] : null;
  if (rawAuto && Array.isArray(rawAuto.context) && rawAuto.context.length) {
    ctx = { sessions: rawAuto.context };
  }
  let realtimeUsage = null;
  if (rawAuto && rawAuto.realtimeUsage) {
    realtimeUsage = rawAuto.realtimeUsage;
  }
  return {
    sess, lt, ctx, realtimeUsage,
    autoState: p.autoKey ? (a ? (a.ok ? 'ok' : 'err') : 'wait') : 'none',
    autoErr: (a && !a.ok) ? a.error : null,
  };
}

// ---------------- 草皮圖(近 12 個月使用量熱力圖,合併所有支援本地日誌的提供商) ----------------
// 伺服器回傳的 { days: {'YYYY-MM-DD': tokens}(Claude+Codex 加總), projectCount, projects: [{label, tokens}], daysByProvider: { claude:{...}, codex:{...} } }
let heatmapData = { days: {}, projectCount: 0, projects: [], daysByProvider: { claude: {}, codex: {} } };
let heatmapProjectsOpen = false; // 專案清單展開/收合狀態,跨每次 renderAll() 重繪要保留
function fmtTokenShort(n) {
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
}
// 座標軸專用格式:數字大時自動換算成 M,避免出現「42590.1k」這種一長串
function fmtAxisTokens(n) {
  if (n >= 1e6) return (Number.isInteger(n / 1e6) ? n / 1e6 : (n / 1e6).toFixed(1)) + 'M';
  if (n >= 1e3) return Math.round(n / 1e3) + 'k';

}
// 把座標軸最大值無條件進位到「1/2/5 × 10^n」的整數關卡,讓刻度是好讀的整數而不是資料的精確值
function niceCeil(v) {
  if (v <= 0) return 1;
  const exp = Math.floor(Math.log10(v));
  const base = Math.pow(10, exp);
  const frac = v / base;
  const niceFrac = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
  return niceFrac * base;
}
function renderHeatmap(payload) {
  const box = $('#heatmapCard');
  if (!box) return;
  const days = payload.days || {};

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const end = new Date(today);
  const start = new Date(end);
  start.setDate(start.getDate() - 371);
  start.setDate(start.getDate() - start.getDay()); // 對齊到最近的週日,湊滿整週

  const weeks = [];
  let cur = new Date(start);
  while (cur <= end) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      if (cur < start || cur > end) {
        week.push(null);
      } else {
        const key = cur.getFullYear() + '-' + pad(cur.getMonth() + 1) + '-' + pad(cur.getDate());
        week.push({ date: new Date(cur), key, count: days[key] || 0 });
      }
      cur.setDate(cur.getDate() + 1);
    }
    weeks.push(week);
  }

  // 分級門檻依非零用量的四分位數計算(近似 GitHub 草皮圖的做法),避免單一離群高值把其他格子全部拉成最低階
  const vals = [];
  weeks.forEach(w => w.forEach(d => { if (d && d.count > 0) vals.push(d.count); }));
  vals.sort((a, b) => a - b);
  const qAt = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const thresholds = [qAt(0.25), qAt(0.5), qAt(0.75)];
  const levelOf = c => {
    if (!c) return 0;
    if (c <= thresholds[0]) return 1;
    if (c <= thresholds[1]) return 2;
    if (c <= thresholds[2]) return 3;
    return 4;
  };

  const monthLabels = [];
  let lastMonth = null;
  weeks.forEach((w, i) => {
    const firstDay = w.find(d => d);
    if (!firstDay) return;
    const m = firstDay.date.getMonth();
    if (m !== lastMonth) { monthLabels.push({ col: i, m }); lastMonth = m; }
  });
  const monthsHtml = monthLabels.map(l =>
    `<span style="grid-column:${l.col + 1}">${MONTHS_I18N[lang][l.m]}</span>`).join('');

  const wdayIdx = [1, 3, 5]; // 只標週一/週三/週五,跟其餘留白避免擁擠
  const wdaysHtml = Array.from({ length: 7 }, (_, i) =>
    `<span>${wdayIdx.includes(i) ? (lang === 'zh-Hant' ? '週' + WEEKDAYS_I18N[lang][i] : WEEKDAYS_I18N[lang][i]) : ''}</span>`).join('');

  const cellsHtml = weeks.map(w => w.map(d => {
    if (!d) return `<div class="heatmap-cell empty"></div>`;
    const lv = levelOf(d.count);
    const tip = d.count > 0
      ? t('heatmapTooltip', { date: d.key, tokens: fmtAxisTokens(d.count) })
      : t('heatmapTooltipNone', { date: d.key });
    return `<div class="heatmap-cell lv${lv}" title="${escapeHtml(tip)}"></div>`;
  }).join('')).join('');

  const projects = payload.projects || []; // 去重後的專案清單(不受 12 個月視窗限制,見 server.js scanClaudeUsage/scanCodexUsage)
  const projectCount = payload.projectCount || projects.length;
  // 欄數固定,但欄寬用 minmax(...,1fr) 撐滿卡片寬度,避免卡片比實際格子寬很多時右側留一大片空白
  const colTemplate = `repeat(${weeks.length}, minmax(8px, 1fr))`;

  const maxProjectTokens = projects.length ? projects[0].tokens : 0;
  const projectRowsHtml = projects.length
    ? projects.map((p, i) => {
        const pct = maxProjectTokens > 0 ? Math.max(3, Math.round(p.tokens / maxProjectTokens * 100)) : 0;
        return `
        <div class="heatmap-project-row">
          <span class="heatmap-project-rank">${i + 1}</span>
          <span class="heatmap-project-name" title="${escapeHtml(p.label)}">${escapeHtml(p.label)}</span>
          <div class="heatmap-project-bar-track"><div class="heatmap-project-bar-fill" style="width:${pct}%"></div></div>
          <span class="heatmap-project-tokens">${fmtAxisTokens(p.tokens)}</span>
        </div>`;
      }).join('')
    : `<div class="heatmap-project-empty">${t('heatmapNoProjects')}</div>`;

  box.innerHTML = `
    <div class="heatmap-inner">
      <div class="heatmap-months" style="grid-template-columns:${colTemplate}">${monthsHtml}</div>
      <div class="heatmap-body">
        <div class="heatmap-wdays">${wdaysHtml}</div>
        <div class="heatmap-grid" style="grid-template-columns:${colTemplate}">${cellsHtml}</div>
      </div>
      <div class="heatmap-footer">
        <button type="button" class="heatmap-caption-btn" id="heatmapCaptionBtn" aria-expanded="${heatmapProjectsOpen}">
          <span>${t('heatmapCaption', { n: projectCount })}</span>
          <span class="heatmap-chev">${heatmapProjectsOpen ? '▲' : '▼'}</span>
        </button>
        <div class="heatmap-legend">
          <span>${t('heatmapLess')}</span>
          <div class="heatmap-cell lv0"></div><div class="heatmap-cell lv1"></div>
          <div class="heatmap-cell lv2"></div><div class="heatmap-cell lv3"></div><div class="heatmap-cell lv4"></div>
          <span>${t('heatmapMore')}</span>
        </div>
      </div>
      ${heatmapProjectsOpen ? `<div class="heatmap-project-list">${projectRowsHtml}</div>` : ''}
    </div>`;

  const btn = box.querySelector('#heatmapCaptionBtn');
  if (btn) btn.addEventListener('click', () => {
    heatmapProjectsOpen = !heatmapProjectsOpen;
    renderHeatmap(payload);
  });
}

// ---------------- Token 流量圖(小時/日/週 三種粒度切換,可勾選 Claude/Codex) ----------------
const TOKENFLOW_SEL_KEY = 'aiDash.tokenFlowSel.v1';

const TOKENFLOW_GRAN_KEY = 'aiDash.tokenFlowGran.v1';
const TOKENFLOW_GRANS = ['hour', 'day', 'week'];

// 依粒度組出 { label, claude, codex } 陣列;日/週來自 heatmapData.daysByProvider(伺服器端已依 provider 分開統計),
// 小時來自 autoData.*.realtimeUsage.hourly(既有邏輯不變)
function buildTokenFlowPoints(gran) {
  if (gran === 'hour') {
    const claudeHourly = (autoData.claude && autoData.claude.realtimeUsage && autoData.claude.realtimeUsage.hourly) || null;
    const codexHourly = (autoData.codex && autoData.codex.realtimeUsage && autoData.codex.realtimeUsage.hourly) || null;
    const points = [];
    for (let hoursAgo = 23; hoursAgo >= 0; hoursAgo--) {
      const hourDate = new Date(Date.now() - hoursAgo * 3600000);
      points.push({
        label: pad(hourDate.getHours()) + ':00',
        claude: claudeHourly ? (claudeHourly[hoursAgo] || 0) : 0,
        codex: codexHourly ? (codexHourly[hoursAgo] || 0) : 0,
      });
    }
    return { points, noData: !claudeHourly && !codexHourly };
  }
  const byProv = heatmapData.daysByProvider || { claude: {}, codex: {} };
  const noData = !Object.keys(byProv.claude || {}).length && !Object.keys(byProv.codex || {}).length;
  if (gran === 'day') {
    const points = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let daysAgo = 13; daysAgo >= 0; daysAgo--) {
      const d = new Date(today); d.setDate(d.getDate() - daysAgo);
      const key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      points.push({
        label: (d.getMonth() + 1) + '/' + d.getDate(),
        claude: (byProv.claude && byProv.claude[key]) || 0,
        codex: (byProv.codex && byProv.codex[key]) || 0,
      });
    }
    return { points, noData };
  }
  // week:週日為週首,跟草皮圖(renderHeatmap)的分週方式一致
  const points = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const thisWeekStart = new Date(today); thisWeekStart.setDate(thisWeekStart.getDate() - thisWeekStart.getDay());
  for (let weeksAgo = 11; weeksAgo >= 0; weeksAgo--) {
    const wStart = new Date(thisWeekStart); wStart.setDate(wStart.getDate() - weeksAgo * 7);
    let claude = 0, codex = 0;
    for (let i = 0; i < 7; i++) {
      const d = new Date(wStart); d.setDate(d.getDate() + i);
      const key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      claude += (byProv.claude && byProv.claude[key]) || 0;
      codex += (byProv.codex && byProv.codex[key]) || 0;
    }
    points.push({ label: (wStart.getMonth() + 1) + '/' + wStart.getDate(), claude, codex });
  }
  return { points, noData };
}

const TOKENFLOW_TITLE_KEY = { hour: 'tokenFlowTitleHour', day: 'tokenFlowTitleDay', week: 'tokenFlowTitleWeek' };
const TOKENFLOW_TAB_KEY = { hour: 'tokenFlowTabHour', day: 'tokenFlowTabDay', week: 'tokenFlowTabWeek' };
function renderTokenFlow() {
  const box = $('#tokenFlowCard');
  if (!box) return;
  const { points, noData } = buildTokenFlowPoints(tokenFlowGran);

  const shownVals = [];
  if (tokenFlowSel.claude) points.forEach(p => shownVals.push(p.claude));
  if (tokenFlowSel.codex) points.forEach(p => shownVals.push(p.codex));
  const max = Math.max(1, ...shownVals);
  const niceMax = niceCeil(max); // 長條高度跟 Y 軸刻度都用同一個「整數關卡」當 100%,兩者才會對得上

  const barHtml = (val, cls, label) => {
    const pct = val > 0 ? Math.max(2, Math.round(val / niceMax * 100)) : 0;
    const tip = t('tokenFlowTooltip', { time: label, tokens: (cls === 'claude' ? 'Claude ' : 'Codex ') + fmtTokenShort(val) });
    return `<div class="tf-bar ${cls}" style="height:${pct}%" title="${escapeHtml(tip)}"></div>`;
  };
  const chartHtml = points.map(p => {
    const bars = [];

  const yTicks = [niceMax, niceMax * 0.75, niceMax * 0.5, niceMax * 0.25, 0];
  const yAxisHtml = yTicks.map(v => `<span>${fmtAxisTokens(v)}</span>`).join('');

      </div>

    <div class="tokenflow-body">
      <div class="tokenflow-yaxis">${yAxisHtml}</div>
      <div class="tokenflow-plot">
        <div class="tokenflow-gridlines">${gridlinesHtml}</div>
        <div class="tokenflow-chart">${chartHtml}</div>

  box.querySelectorAll('[data-gran]').forEach(b =>
    b.addEventListener('click', () => setTokenFlowGran(b.dataset.gran)));

  const onToggle = (key) => (e) => {
    // 兩個都取消勾選的話畫面會整個空掉,還原成使用者剛取消的那一個,至少留一條線

// ---------------- 上下拖拉排序 ----------------
let dragId = null;
let dragFromHandle = false;
function clearDragMarks() {
  document.querySelectorAll('.row.drag-over-top, .row.drag-over-bottom')
    .forEach(r => r.classList.remove('drag-over-top', 'drag-over-bottom'));
}
function wireDragSort(box) {
  box.querySelectorAll('.row').forEach(row => {
    const handle = row.querySelector('.drag-handle');
    handle.addEventListener('mousedown', () => { dragFromHandle = true; });
    row.addEventListener('dragstart', e => {
      if (!dragFromHandle) { e.preventDefault(); return; } // 只允許從 ⠿ 把手拖
      dragId = row.dataset.row;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });
    row.addEventListener('dragend', () => {
      dragFromHandle = false;
      dragId = null;
      row.classList.remove('dragging');
      clearDragMarks();
    });
    row.addEventListener('dragover', e => {
      if (!dragId || row.dataset.row === dragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      row.classList.toggle('drag-over-top', before);
      row.classList.toggle('drag-over-bottom', !before);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drag-over-top', 'drag-over-bottom');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const id = dragId || e.dataTransfer.getData('text/plain');
      if (!id || row.dataset.row === id) return;
      const rect = row.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      const list = state.providers;
      const fromIdx = list.findIndex(p => p.id === id);
      if (fromIdx < 0) return;
      const [moved] = list.splice(fromIdx, 1);
      let toIdx = list.findIndex(p => p.id === row.dataset.row);
      if (!before) toIdx++;
      list.splice(toIdx, 0, moved);
      dragId = null;
      dragFromHandle = false;
      save();
      renderAll();
    });
  });
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

// ---------------- 每秒心跳:倒數條 + 手動模式到期翻新 ----------------
const SOON_MS = 30 * 60000; // 剩不到 30 分鐘 → 外框開始發亮蓄力
const RESET_MARK_SOON_MS = 2 * 3600000; // 距重置 2 小時內 → 「重置於 ...」變色提醒
const prevCdState = {};

function tick() {
  const now = Date.now();
  document.querySelectorAll('[data-cd]').forEach(el => {
    const pid = el.dataset.pid;
    const kind = el.dataset.kind;
    const key = `${pid}-${kind}`;
    const resets = Number(el.dataset.resets);
    const winMs = Number(el.dataset.window) * 60000;
    const fill = el.querySelector('.fill');
    const text = el.querySelector('.bar-text');
    const remainEl = el.parentElement.querySelector('.cd-remain');
    if (!resets) {
      fill.className = 'fill'; fill.style.width = '0%'; text.textContent = '—';
      el.classList.remove('soon', 'ready');
      if (remainEl) remainEl.textContent = '—';
      prevCdState[key] = 'none';
      return;
    }
    const remain = resets - now;
    if (remain <= 0) {
      el.classList.remove('soon');
      el.classList.add('ready');
      fill.className = 'fill r';
      fill.style.width = '0%';
      text.textContent = t('readyText');
      if (remainEl) remainEl.textContent = fmtDur(0);

      // 觸發滿血重生爆光閃爍 & 桌面通知
      if (prevCdState[key] === 'counting') {
        el.classList.add('refill-flash');
        setTimeout(() => el.classList.remove('refill-flash'), 1500);
        const p = state.providers.find(x => x.id === pid);
        const name = p ? p.name : pid;
        if (notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
          new Notification(t('notifyResetTitle', { name }), {
            body: t('notifyResetBody'),
            icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 32 32\'%3E%3Crect width=\'32\' height=\'32\' rx=\'7\' fill=\'%230b1220\'/%3E%3Crect x=\'5\' y=\'17\' width=\'5\' height=\'10\' rx=\'1.5\' fill=\'%2322c55e\'/%3E%3C/svg%3E'
          });
        }
      }
      prevCdState[key] = 'ready';
      return;
    }
    prevCdState[key] = 'counting';
    el.classList.remove('ready');
    if (remain <= SOON_MS) {
      el.classList.add('soon');
      const frac = Math.min(1, Math.max(0, remain / SOON_MS)); // 1 = 剛進 30 分鐘,0 = 快到了
      el.style.setProperty('--charge-speed', (0.35 + frac * 1.25).toFixed(2) + 's');
    } else {
      el.classList.remove('soon');
      el.style.removeProperty('--charge-speed');
    }
    // 剩餘 % = 跟使用量條同步:越接近重置越空、色階(綠/黃/紅)套用同一組 hpClass 門檻
    const remainPct = winMs > 0 ? Math.min(100, Math.max(0, remain / winMs * 100)) : 0;
    const elapsedPct = 100 - remainPct;
    fill.className = 'fill ' + hpClass(elapsedPct);
    fill.style.width = remainPct.toFixed(2) + '%';
    text.textContent = t('remainPct', { pct: remainPct.toFixed(remainPct < 10 ? 1 : 0) });
    if (remainEl) remainEl.textContent = fmtDur(remain);
  });

  // 快重置提醒:距重置 2 小時內,「重置於 ...」字樣變色提醒(使用量條與倒數條的重置時間標註共用)
  document.querySelectorAll('[data-reset-mark]').forEach(el => {
    const resets = Number(el.dataset.resets);
    const remain = resets - now;
    el.classList.toggle('reset-soon', !!resets && remain > 0 && remain <= RESET_MARK_SOON_MS);
  });

  // 使用量條合併顯示的即時倒數文字(HH:MM:SS,見 hpCell 的 cdRemainHtml)
  document.querySelectorAll('[data-cd-text]').forEach(el => {
    const resets = Number(el.dataset.resets);
    if (!resets) { el.textContent = '—'; return; }
    const remain = resets - now;
    el.textContent = remain <= 0 ? t('readyText') : fmtDur(remain);
  });

  // 手動模式:重置時間過了 → 自動推進到下一週期,使用率歸零
  let changed = false;
  for (const p of state.providers) {
    const e = effective(p);
    for (const [kind, eff] of [['session', e.sess], ['longterm', e.lt]]) {
      if (eff.src !== 'manual') continue;
      const m = p.manual[kind];
      if (m.resetsAt && m.windowMin && m.resetsAt <= now) {
        while (m.resetsAt <= now) m.resetsAt += m.windowMin * 60000;
        m.usedPct = 0;
        changed = true;
      }
    }
  }
  if (changed) { save(); renderAll(); }
}
setInterval(tick, 1000);

async function poll() {
  try {
    const r = await fetch('api/usage?lang=' + lang, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    autoData = j.providers || {};
    heatmapData = j.heatmap || { days: {}, projectCount: 0, daysByProvider: { claude: {}, codex: {} } };
    online = true;
    lastSync = Date.now();
  } catch {
    online = false;
  }
  $('#statusDot').className = 'dot ' + (online ? 'ok' : '');
  $('#statusText').textContent = online
    ? t('serverConnected', { time: fmtAbs(lastSync) })
    : t('offlineMode');
  renderAll();
}
setInterval(poll, 60000);

  $('#dlgTitle').textContent = t('editDlgTitle');
  const isAuto = pid && p.autoKey && autoData[p.autoKey] && autoData[p.autoKey].ok;
  $('#dlgHint').textContent = isAuto ? t('dlgHintAuto') : t('dlgHintManual');
  $('#fName').value = p.name;
  $('#fSessPct').value = p.manual.session.usedPct ?? '';
  $('#fSessReset').value = toLocalInput(p.manual.session.resetsAt);
  $('#fSessWin').value = p.manual.session.windowMin ?? 300;
  $('#fLtLabel').value = p.manual.longterm.label || '每週';
  $('#fLtPct').value = p.manual.longterm.usedPct ?? '';
  $('#fLtReset').value = toLocalInput(p.manual.longterm.resetsAt);
  $('#fLtWin').value = p.manual.longterm.windowMin ?? 10080;
  $('#delBtn').style.display = pid ? '' : 'none';
  dlg.showModal();
}

$('#dlgForm').addEventListener('submit', () => {
  const numOr = (v, fb) => { const n = parseFloat(v); return isFinite(n) ? n : fb; };
  const p = editingId ? state.providers.find(x => x.id === editingId) : null;
  if (!p) return;
  p.name = $('#fName').value.trim() || p.name || t('unnamedDefault');
  p.manual.session.usedPct = numOr($('#fSessPct').value, null);
  p.manual.session.resetsAt = fromLocalInput($('#fSessReset').value);
  p.manual.session.windowMin = numOr($('#fSessWin').value, 300);
  p.manual.longterm.label = $('#fLtLabel').value;
  p.manual.longterm.usedPct = numOr($('#fLtPct').value, null);
  p.manual.longterm.resetsAt = fromLocalInput($('#fLtReset').value);
  p.manual.longterm.windowMin = numOr($('#fLtWin').value, 10080);
  save(); renderAll();
});
$('#cancelBtn').addEventListener('click', () => dlg.close());
$('#delBtn').addEventListener('click', () => {
  if (!editingId) return;
  const p = state.providers.find(x => x.id === editingId);
  if (p && confirm(t('confirmDelete', { name: p.name }))) {
    state.providers = state.providers.filter(x => x.id !== editingId);
    save(); dlg.close(); renderAll();
  }
});
// 新增提供商:只列出有支援自動同步、且尚未在儀表板上的
const addDlg = $('#addDlg');
$('#addBtn').addEventListener('click', () => {
  const missing = BUILTINS.filter(([id]) => !state.providers.some(p => p.id === id));
  if (!missing.length) {
    const sep = lang === 'zh-Hant' ? '、' : ', ';
    toast(t('allProvidersAdded', { list: BUILTINS.map(b => b[1]).join(sep) }));
    return;
  }
  $('#addList').innerHTML = missing.map(([id, name, hasAuto]) =>
    `<button type="button" class="primary" data-add="${id}">${name}${hasAuto ? '' : t('manualSuffix')}</button>`).join('');
  $('#addList').querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.add;
    const entry = BUILTINS.find(x => x[0] === key);
    const name = entry[1];
    state.providers.push(mkBuiltin(entry));
    if (!state.seeded.includes(key)) state.seeded.push(key);
    save();
    renderAll();
    addDlg.close();
    toast(t('providerAdded', { name }));
    poll();
  }));
  addDlg.showModal();
});
$('#addCancel').addEventListener('click', () => addDlg.close());

// ---------------- 啟動 ----------------
applyStaticI18n();
renderAll();
poll();
</script>
</body>
</html>
